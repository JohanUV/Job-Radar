services:
  db:
    image: postgres:16
    container_name: radar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data

volumes:
  radar_pgdata:
